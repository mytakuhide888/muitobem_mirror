{% load i18n %}
{% include "admin/nav_sidebar.html" %}

<style>
  .nav-sidebar .console-menu-marker {
    letter-spacing: 0.08em;
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 0.75rem;
  }

  .nav-sidebar .console-group > .nav-link {
    border-radius: 12px;
    margin: 0 0.35rem 0.3rem;
    padding: 0.8rem 0.9rem;
    background: rgba(255, 255, 255, 0.02);
    transition: background-color 0.2s ease;
  }

  .nav-sidebar .console-group > .nav-link:hover,
  .nav-sidebar .console-group.is-open > .nav-link,
  .nav-sidebar .console-group.is-active > .nav-link {
    background: rgba(255, 255, 255, 0.08);
  }

  .nav-sidebar .console-group-label {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 0;
  }

  .nav-sidebar .console-group-label strong,
  .nav-sidebar .console-group-label span {
    white-space: normal;
    line-height: 1.25;
  }

  .nav-sidebar .console-group-label span {
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.62);
  }

  .nav-sidebar .console-subtree {
    display: none;
    margin: 0 0.35rem 0.55rem;
    padding: 0.25rem 0 0.35rem;
    border-left: 1px solid rgba(255, 255, 255, 0.12);
  }

  .nav-sidebar .console-group.is-open > .console-subtree {
    display: block;
  }

  .nav-sidebar .console-subtree .nav-link {
    margin-left: 0.65rem;
    border-radius: 10px;
    padding: 0.65rem 0.85rem;
    white-space: normal;
    line-height: 1.3;
  }

  .nav-sidebar .console-subtree .nav-link.active {
    background: rgba(96, 165, 250, 0.22);
    color: #fff;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const navSidebar = document.querySelector("ul.nav-sidebar");
    if (!navSidebar || document.getElementById("console-sidebar-menu-root")) {
      return;
    }

    const currentPath = window.location.pathname.replace(/\/+$/, "/");
    const canonicalPath = currentPath.replace(/^\/admin(?=\/console\/)/, "");
    const groups = [
      {
        label: "基本設定",
        description: "日常運用と環境まわり",
        icon: "fas fa-house",
        items: [
          { label: "ダッシュボード", url: "{% url 'console:index' %}" },
          { label: "アカウント連携", url: "{% url 'console:accounts' %}" },
          { label: "権限チェック", url: "{% url 'console:permissions' %}" },
          { label: "セットアップ", url: "{% url 'console:setup_env' %}" },
          { label: "統合ガイド", url: "{% url 'console:help' %}" },
          { label: "ログ", url: "{% url 'console:logs' %}" },
          { label: "接続テスト", url: "{% url 'console:connection_test' %}" }
        ]
      },
      {
        label: "連携 / Webhook",
        description: "投稿同期と疎通確認",
        icon: "fas fa-plug",
        items: [
          { label: "投稿インポート", url: "{% url 'social:post-import' %}" },
          { label: "投稿同期", url: "{% url 'social:post-sync' %}" },
          { label: "Webhook受信テスト", url: "{% url 'console:webhook_test' %}" },
          { label: "Webhookイベント一覧", url: "{% url 'console:webhook_events' %}" },
          { label: "Webhook設定", url: "{% url 'console:webhook_setup' %}" }
        ]
      },
      {
        label: "企画 / リサーチ",
        description: "バズ分析と企画設計",
        icon: "fas fa-lightbulb",
        items: [
          { label: "コンセプト設計", url: "{% url 'console:concept_design' %}" },
          { label: "バズ投稿取得", url: "{% url 'console:buzz_search' %}" },
          { label: "急成長ランキング", url: "{% url 'console:buzz_growth_ranking' %}" },
          { label: "一括巡回", url: "{% url 'console:buzz_keyword_scan' %}" },
          { label: "トレンド分析", url: "{% url 'console:buzz_trends' %}" }
        ]
      },
      {
        label: "制作 / 運用",
        description: "テンプレと投稿制作",
        icon: "fas fa-pen-ruler",
        items: [
          { label: "テンプレ一覧", url: "{% url 'console:tpl_list' %}" },
          { label: "テンプレ新規", url: "{% url 'console:tpl_new' %}" },
          { label: "テンプレ書出し", url: "{% url 'console:tpl_export' %}" },
          { label: "テンプレ読込", url: "{% url 'console:tpl_import' %}" },
          { label: "投稿文AI生成", url: "{% url 'console:content_generator' %}" },
          { label: "予約投稿管理", url: "{% url 'console:scheduled_posts' %}" },
          { label: "IG投稿管理", url: "{% url 'console:ig_post_manager' %}" },
          { label: "パフォーマンス分析", url: "{% url 'console:post_analytics' %}" },
          { label: "タロットリール生成", url: "{% url 'console:tarot_reel_gen' %}" }
        ]
      },
      {
        label: "顧客対応",
        description: "DMと鑑定運用",
        icon: "fas fa-comments",
        items: [
          { label: "DM受信管理", url: "{% url 'console:dm_inbox' %}" },
          { label: "AI鑑定文生成", url: "{% url 'console:appraisal_gen' %}" },
          { label: "自動返信設定", url: "{% url 'console:auto_reply_settings' %}" }
        ]
      }
    ];

    const normalize = (path) => (path || "/").replace(/\/+$/, "/");
    const parts = ['<li class="nav-header console-menu-marker" id="console-sidebar-menu-root">Console</li>'];

    groups.forEach((group, index) => {
      const itemsHtml = group.items.map((item) => {
        const itemPath = normalize(item.url);
        const adminItemPath = normalize(`/admin${item.url}`);
        const isActive = canonicalPath.startsWith(itemPath) || currentPath.startsWith(adminItemPath);
        return `
          <li class="nav-item">
            <a href="${item.url}" class="nav-link${isActive ? " active" : ""}">
              <i class="far fa-circle nav-icon"></i>
              <p>${item.label}</p>
            </a>
          </li>
        `;
      }).join("");

      parts.push(`
        <li class="nav-item console-group" data-console-group="${index}">
          <a href="#" class="nav-link">
            <i class="nav-icon ${group.icon}"></i>
            <p>
              <span class="console-group-label">
                <strong>${group.label}</strong>
                <span>${group.description}</span>
              </span>
              <i class="right fas fa-angle-left"></i>
            </p>
          </a>
          <ul class="nav nav-treeview console-subtree">
            ${itemsHtml}
          </ul>
        </li>
      `);
    });

    navSidebar.insertAdjacentHTML("beforeend", parts.join(""));

    const allGroups = Array.from(navSidebar.querySelectorAll(".console-group"));
    const setOpen = (group, open) => {
      const icon = group.querySelector(".right");
      group.classList.toggle("is-open", open);
      if (icon) {
        icon.classList.toggle("fa-angle-left", !open);
        icon.classList.toggle("fa-angle-down", open);
      }
    };

    allGroups.forEach((group) => {
      const hasActive = !!group.querySelector(".nav-link.active");
      group.classList.toggle("is-active", hasActive);
      setOpen(group, hasActive);

      const trigger = group.querySelector(":scope > .nav-link");
      if (!trigger) {
        return;
      }

      trigger.addEventListener("click", function (event) {
        event.preventDefault();
        const willOpen = !group.classList.contains("is-open");
        allGroups.forEach((other) => setOpen(other, other === group ? willOpen : false));
      });
    });
  });
</script>
