                        <a href="{% url 'console:webhook_events' %}" class="nav-link">

                        <a href="{% url 'console:connection_test' %}" class="nav-link">

                            <p>接続テスト</p>
                        </a>
                    </li>
                </ul>
            </li>
        `;
            navSidebar.insertAdjacentHTML('beforeend', newMenuHtml);

            // Simple click handler for the new menu
            const toggleLink = navSidebar.lastElementChild.querySelector('a.nav-link');
            if (toggleLink) {
                toggleLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    const parentLi = this.parentElement;
                    const ul = parentLi.querySelector('ul');
                    const icon = this.querySelector('.right');

                    if (ul.style.display === 'none' || !ul.style.display) {
                        ul.style.display = 'block';
                        parentLi.classList.add('menu-open');
                        if (icon) {
                            icon.classList.remove('fa-angle-left');
                            icon.classList.add('fa-angle-down');
                        }
                    } else {
                        ul.style.display = 'none';
                        parentLi.classList.remove('menu-open');
                        if (icon) {
                            icon.classList.remove('fa-angle-down');
                            icon.classList.add('fa-angle-left');
                        }
                    }
                });
            }
        }
    });
</script>
